{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard | GGL</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #effcf7;
            color: #0b3924;
        }

        .wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 300px;
            background: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }

        .sidebar-header {
            background: #05632f;
            color: white;
            padding: 20px 25px 30px;
        }

        .logo {
            width: 100px;
            height: 75px;
            background: white;
            border-radius: 0 0 10px 10px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .sidebar-header h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .sidebar-header p {
            font-size: 16px;
        }

        .menu {
            padding: 25px;
        }

        .menu-title {
            font-size: 13px;
            color: #7b8b83;
            font-weight: bold;
            margin: 15px 0 18px;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 18px;
            text-decoration: none;
            color: #123d29;
            font-weight: bold;
            padding: 15px 5px;
            font-size: 16px;
        }

        .menu a i {
            color: #078442;
            font-size: 18px;
            width: 20px;
        }

        .menu a:hover {
            color: #078442;
        }

        /* MAIN */

        .main {
            margin-left: 300px;
            width: calc(100% - 300px);
        }

        /* NAVBAR */

        .navbar {
            height: 85px;
            background: #05632f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .navbar h1 {
            font-size: 28px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: right;
        }

        .user-info h3 {
            margin-bottom: 5px;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            color: #08743b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        /* CONTENT */

        .content {
            padding: 22px 30px 35px;
        }

        .welcome {
            background: #05632f;
            color: white;
            border-radius: 22px;
            padding: 35px 30px;
            margin-bottom: 27px;
        }

        .welcome h2 {
            font-size: 37px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 18px;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 27px;
            margin-bottom: 27px;
        }

        .card {
            background: white;
            border: 1px solid #d5e2dc;
            border-radius: 22px;
            padding: 28px;
            height: 225px;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: #e6f5ed;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .icon-box i {
            color: #078442;
            font-size: 27px;
        }

        .card h2 {
            font-size: 30px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .card p {
            color: #172d22;
            font-size: 17px;
        }

        /* RECENT MOVEMENT */

        .movement {
            background: white;
            border: 1px solid #d5e2dc;
            border-radius: 22px;
            padding: 28px;
        }

        .movement-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .movement-header h2 {
            font-size: 28px;
        }

        .view-btn {
            background: #056c36;
            color: white;
            text-decoration: none;
            padding: 15px 22px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #e5f4ec;
            color: #08733b;
            padding: 18px;
            font-size: 13px;
            text-align: left;
        }

        td {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            color: #111;
        }

        /* RESPONSIVE */

        @media(max-width: 1000px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 700px) {

            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .welcome h2 {
                font-size: 27px;
            }

        }
    </style>

</head>

<body>

    <div class="wrapper">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <div class="sidebar-header">

                <img src="https://gglengage.com/images/ggllogo.png" class="logo">

                <h2>GGL User</h2>

                <p>File Tracking Dashboard</p>

            </div>

            <div class="menu">

                <div class="menu-title">MAIN</div>

                <a href="{% url 'userdashboard' %}">
                    <i class="bi bi-speedometer2"></i>
                    User Dashboard
                </a>

                <div class="menu-title">MY FILES</div>

                <a href="{% url 'user_create_file' %}">
                    <i class="bi bi-file-earmark-plus"></i>
                    Upload File
                </a>
                <a href="{% url 'receivedfiles' %}">
                    <i class="bi bi-inbox-fill"></i>
                    Received Files
                </a>

                <a href="{% url 'sentfiles' %}">
                    <i class="bi bi-send-fill"></i>
                    Sent Files
                </a>

                <a href="{% url 'pendingfiles' %}">
                    <i class="bi bi-clock-fill"></i>
                    Pending Files
                </a>

                <a href="{% url 'usershowfile' %}">
                    <i class="bi bi-folder-fill"></i>
                    My All Files
                </a>

                <a href="{% url 'userfiletrack' %}">
                    <i class="bi bi-search"></i>
                    File Track
                </a>

                <div class="menu-title">ACCOUNT</div>

                <a href="{% url 'userlogout' %}">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>

            </div>

        </div>


        <!-- MAIN CONTENT -->

        <div class="main">

            <!-- NAVBAR -->

            <div class="navbar">

                <h1>User Panel</h1>

                <div class="user-info">

                    <div>
                        <h3>User</h3>
                        <p>File User</p>
                    </div>

                    <div class="user-avatar">
                        U
                    </div>

                </div>

            </div>

            <!-- CONTENT -->

            <div class="content">

                {% block user %}

                {% endblock %}

            </div>

        </div>

    </div>

</body>

</html>
