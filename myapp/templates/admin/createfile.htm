{% extends 'admin/adminlayout.htm' %}

{% block admin %}

<style>
    .create-file-page {
        width: 100%;
        padding: 0;
        color: #14275d;
    }

    .create-file-title {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 4px;
        color: #14275d;
    }

    .create-file-subtitle {
        font-size: 13px;
        color: #66708c;
        margin-bottom: 15px;
    }

    .file-card {
        width: 100%;
        background: #ffffff;
        border: 1px solid #d7e2ff;
        border-radius: 17px;
        padding: 20px 21px 21px;
    }

    .file-card-title {
        font-size: 18px;
        font-weight: 700;
        color: #14275d;
        margin-bottom: 20px;
    }

    .file-form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 19px;
    }

    .file-form-group {
        width: 100%;
    }

    .file-form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #14275d;
        margin-bottom: 8px;
    }

    .file-input,
    .file-select,
    .file-textarea {
        width: 100%;
        border: 1px solid #cbd9ff;
        background: #f8faff;
        border-radius: 10px;
        outline: none;
        color: #252525;
        font-family: "Rubik", sans-serif;
        font-size: 13px;
        transition: 0.3s ease;
    }

    .file-input,
    .file-select {
        height: 46px;
        padding: 0 11px;
    }

    .file-textarea {
        height: 101px;
        padding: 12px;
        resize: vertical;
    }

    .file-input:focus,
    .file-select:focus,
    .file-textarea:focus {
        border-color: #2455d6;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(36, 85, 214, 0.08);
    }

    .file-upload {
        width: 100%;
        height: 46px;
        border: 1px solid #cbd9ff;
        background: #f8faff;
        border-radius: 10px;
        font-size: 13px;
        overflow: hidden;
    }

    .file-upload::file-selector-button {
        height: 45px;
        border: none;
        border-right: 1px solid #d6def3;
        background: #ffffff;
        padding: 0 12px;
        margin-right: 10px;
        cursor: pointer;
        font-family: "Rubik", sans-serif;
    }

    .full-width {
        width: 100%;
        margin-bottom: 19px;
    }

    .form-buttons {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 2px;
    }

    .save-file-btn {
        border: none;
        background: #1f4bc5;
        color: #ffffff;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: "Rubik", sans-serif;
    }

    .save-file-btn:hover {
        background: #173da8;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #e9efff;
        color: #2455d6;
        padding: 10px 13px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
    }

    .back-btn:hover {
        background: #dce6ff;
        color: #1d49c5;
    }

    @media screen and (max-width: 900px) {
        .file-form-row {
            grid-template-columns: 1fr;
        }
    }
</style>


<div class="create-file-page">

    <h1 class="create-file-title">Create File</h1>

    <p class="create-file-subtitle">
        Upload/update file and assign it to another employee
    </p>


    <div class="file-card">

        <h2 class="file-card-title">
            File Information
        </h2>


        {% if messages %}

        {% for message in messages %}

        <div class="alert alert-success">
            {{ message }}
        </div>

        {% endfor %}

        {% endif %}


        <form method="POST" action="{% url 'admin_create_file' %}" enctype="multipart/form-data">

            {% csrf_token %}



            <!-- ROW 1 -->

            <div class="file-form-row">

                <div class="file-form-group">

                    <label>File No</label>

                    <input type="text" name="file_no" class="file-input" placeholder="Auto generate if blank">

                </div>


                <div class="file-form-group">

                    <label>Subject</label>

                    <input type="text" name="subject" class="file-input">

                </div>

            </div>


            <!-- ROW 2 -->

            <div class="file-form-row">

                <div class="file-form-group">

                    <label>Priority</label>

                    <select name="priority" class="file-select">

                        <option value="Medium">Medium</option>

                        <option value="Low">Low</option>

                        <option value="High">High</option>

                    </select>

                </div>


                <div class="file-form-group">

                    <label>Department</label>

                    <select name="department" class="file-select">

                        <option value="" selected disabled>
                            Select Department
                        </option>

                        <option value="IT Department">
                            IT Department
                        </option>

                        <option value="Administration">
                            Administration
                        </option>

                        <option value="Account Department">
                            Account Department
                        </option>

                        <option value="HR Department">
                            HR Department
                        </option>

                    </select>

                </div>
            </div>


            <!-- ROW 3 -->

            <div class="file-form-row">

                <div class="file-form-group">

                    <label>Move/Assign To</label>

                    <select name="employee" class="file-select">

                        <option value="" selected>
                            Select Employee
                        </option>

                        {% for u in users %}

                        <option value="{{ u.username }}">
                            {{ u.username }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="file-form-group">

                    <label>Attachment</label>

                    <input type="file" name="attachment" class="file-upload">

                </div>

            </div>


            <!-- DESCRIPTION -->

            <div class="file-form-group full-width">

                <label>Description</label>

                <textarea name="description" class="file-textarea"></textarea>

            </div>


            <!-- REMARKS -->

            <div class="file-form-group full-width">

                <label>Remarks</label>

                <textarea name="remarks" class="file-textarea"></textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-buttons">

                <button type="submit" class="save-file-btn">

                    <i class="bi bi-floppy-fill"></i>

                    Save File

                </button>


                <a href="javascript:history.back()" class="back-btn">

                    Back

                </a>

            </div>


        </form>

    </div>

</div>

{% endblock %}
