{% extends 'admin/adminlayout.htm' %}

{% block admin %}

<style>
    .dept-page {
        width: 100%;
        color: #14275d;
    }

    .dept-title {
        font-size: 34px;
        font-weight: 700;
        color: #14275d;
        margin: 0 0 5px;
    }

    .dept-subtitle {
        color: #66708c;
        font-size: 15px;
        margin-bottom: 24px;
    }

    .dept-card {
        width: 100%;
        background: #fff;
        border: 1px solid #d7e2ff;
        border-radius: 20px;
        padding: 28px;
    }

    .dept-card-title {
        color: #14275d;
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 22px;
    }

    .dept-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    .dept-grp {
        width: 100%;
    }

    .dept-grp label {
        display: block;
        color: #14275d;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 7px;
    }

    .dept-inp,
    .dept-sel {
        width: 100%;
        border: 1px solid #cbd9ff;
        background: #f8faff;
        border-radius: 12px;
        outline: none;
        color: #222;
        font-family: Rubik, sans-serif;
        font-size: 15px;
        transition: 0.3s ease;
        height: 50px;
        padding: 0 14px;
    }

    .dept-inp:focus,
    .dept-sel:focus {
        border-color: #2455d6;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(36, 85, 214, 0.08);
    }

    .dept-btns {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
    }

    .dept-save {
        border: none;
        background: #1f4bc5;
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: Rubik, sans-serif;
    }

    .dept-save:hover {
        background: #173da8;
    }

    .dept-back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #e9efff;
        color: #2455d6;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
    }

    .dept-back:hover {
        background: #dce6ff;
        color: #1d49c5;
    }

    @media (max-width: 900px) {
        .dept-row {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="dept-page">

    <h1 class="dept-title">Edit Department</h1>
    <p class="dept-subtitle">Update department details</p>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
    {% endif %}

    <div class="dept-card">

        <h2 class="dept-card-title">Department Information</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="dept-row">

                <div class="dept-grp">
                    <label>Department Name</label>
                    <input type="text" name="department_name" class="dept-inp" value="{{ department.department_name }}">
                </div>

                <div class="dept-grp">
                    <label>Department Code</label>
                    <input type="text" name="department_code" class="dept-inp" value="{{ department.department_code }}">
                </div>

            </div>

            <div class="dept-row">

                <div class="dept-grp">
                    <label>Department Head</label>
                    <input type="text" name="department_head" class="dept-inp" value="{{ department.dep_head }}">
                </div>

                <div class="dept-grp">
                    <label>Status</label>
                    <select name="status" class="dept-sel">
                        <option value="Active" {% if department.status=='Active' %}selected{% endif %}>Active
                        </option>
                        <option value="Inactive" {% if department.status=='Inactive' %}selected{% endif %}>
                            Inactive</option>
                    </select>
                </div>

            </div>

            <div class="dept-row">

                <div class="dept-grp">
                    <label>Department Email</label>
                    <input type="email" name="department_email" class="dept-inp" value="{{ department.dep_email }}">
                </div>

                <div class="dept-grp">
                    <label>Contact Number</label>
                    <input type="text" name="contact_number" class="dept-inp" value="{{ department.dep_number }}">
                </div>

            </div>

            <div class="dept-btns">
                <button type="submit" class="dept-save">
                    <i class="bi bi-floppy-fill"></i> Update Department
                </button>
                <a href="{% url 'depshow' %}" class="dept-back">Back to List</a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
